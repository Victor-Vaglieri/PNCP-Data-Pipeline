x-airflow-common: &airflow-common
  image: pncp-airflow:latest
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-local-jwt-secret-key-at-least-32-bytes}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-pncp}:${POSTGRES_PASSWORD:-pncp}@postgres:5432/airflow
    RAW_DATA_DIR: /opt/airflow/data/raw
    SILVER_DATA_DIR: /opt/airflow/data/processed
    GOLD_DATA_DIR: /opt/airflow/data/gold
    DATABASE_URL: postgresql://${POSTGRES_USER:-pncp}:${POSTGRES_PASSWORD:-pncp}@postgres:5432/${POSTGRES_DB:-pncp}
    SPARK_LOCAL_IP: 127.0.0.1
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./src:/opt/airflow/src
    - airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16-alpine
    container_name: pncp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pncp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pncp}
      POSTGRES_DB: ${POSTGRES_DB:-pncp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres_init.sql:/docker-entrypoint-initdb.d/00_airflow_db.sql:ro
      - ./src/pncp_pipeline/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pncp} -d ${POSTGRES_DB:-pncp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: pncp-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        python -c "import os, psycopg; conn=psycopg.connect(os.environ['DATABASE_URL'], autocommit=True); exists=conn.execute(\"SELECT 1 FROM pg_database WHERE datname='airflow'\").fetchone(); exists or conn.execute('CREATE DATABASE airflow')"
        airflow db migrate

  airflow-api-server:
    <<: *airflow-common
    container_name: pncp-airflow-api
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/version')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-scheduler:
    <<: *airflow-common
    container_name: pncp-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    container_name: pncp-airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  spark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pncp-spark
    user: "50000:0"
    profiles: ["spark"]
    environment:
      RAW_DATA_DIR: /app/data/raw
      SILVER_DATA_DIR: /app/data/processed
      GOLD_DATA_DIR: /app/data/gold
      SPARK_LOCAL_IP: 127.0.0.1
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./tests:/app/tests
    command: ["python", "-m", "pncp_pipeline.transformations", "spark"]

volumes:
  postgres_data:
  airflow_logs:
