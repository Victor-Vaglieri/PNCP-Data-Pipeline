name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src dags tests
      - name: Run unit tests
        run: pytest tests/unit -v

  integration-postgres-spark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pncp
          POSTGRES_PASSWORD: pncp
          POSTGRES_DB: pncp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pncp -d pncp"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://pncp:pncp@localhost:5432/pncp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies with Spark
        run: pip install -e ".[spark,dev]"
      - name: Run integration tests
        run: pytest tests/integration -v
